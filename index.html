
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aimer</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
  background: #fff;
  color: #000;
  font-family: Arial, sans-serif;
}

.intro-fade {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
  pointer-events: none;
  animation: fadeAway 2.5s ease forwards;
}

@keyframes fadeAway {
  0%, 35% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* Aimer logo */
.logo {
  position: fixed;
  top: 22px;
  left: 25px;
  width: 105px;
  height: auto;
  z-index: 10;
}

/* BearWare logo and copyright */
.bearware-brand {
  position: fixed;
  top: 22px;
  right: 65px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: max-content;
  max-width: none;
}

.bearware-logo {
  width: 165px;
  height: auto;
  object-fit: contain;
}

.bearware-copyright {
  margin-top: 14px;
  color: #999;
  font-size: 10px;
  line-height: 1.4;
  text-align: center;
  white-space: nowrap;
  max-width: none;
  letter-spacing: -0.15px;
}

/* Book */
.book-area {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1400px;
  padding: 0;
}

.book-container {
  position: relative;
  width: 300px;
  height: 450px;
  perspective: 1400px;
  animation: bookIntro 2.8s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes bookIntro {
  0% {
    opacity: 0;
    transform: scale(2.4) translateY(60px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.book {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 1s ease;
  cursor: pointer;
}

.book-container:hover .book {
  transform: translateX(75px);
}

.book-cover {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 1s ease;
  z-index: 3;
}

.book-container:hover .book-cover {
  transform: rotateY(-180deg);
}

.cover-front,
.cover-back {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.cover-back {
  transform: rotateY(180deg);
}

.book-pages {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  z-index: 1;
}

/* Mobile */
@media (max-width: 600px) {
  .logo {
    width: 85px;
    top: 17px;
    left: 17px;
  }

  .bearware-brand {
    top: 15px;
    right: 15px;
    width: max-content;
  }

  .bearware-logo {
    width: 110px;
  }

  .bearware-copyright {
    font-size: clamp(5.5px, 1.6vw, 7px);
    margin-top: 10px;
    white-space: nowrap;
    letter-spacing: -0.2px;
  }

  .book-area {
    padding-bottom: 0;
  }

  .book-container {
    width: 245px;
    height: 367px;
    animation-name: bookIntroMobile;
  }

  @keyframes bookIntroMobile {
    0% {
      opacity: 0;
      transform: scale(2.4) translateY(60px);
    }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .book-container:hover .book {
    transform: translateX(45px);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="intro-fade"></div>

<img
  class="logo"
  src="https://aaronthecarter.github.io/Aimer/AimerLogo.png"
  alt="Aimer logo"
>

<div class="bearware-brand">
  <img
    class="bearware-logo"
    src="https://aaronthecarter.github.io/Aimer/BearWare.png"
    alt="BearWare logo"
  >

  <div class="bearware-copyright">
    Copyright © 2026 Bearware Publishing™ All rights reserved.
  </div>
</div>

<main class="book-area">
  <div class="book-container" id="bookContainer">
    <div class="book">

      <img
        class="book-pages"
        src="https://aaronthecarter.github.io/Aimer/notdone.png"
        alt="Aimer book pages"
      >

      <div class="book-cover">
        <img
          class="cover-front"
          src="https://aaronthecarter.github.io/Aimer/AimerCover.png"
          alt="Aimer front cover"
        >

        <img
          class="cover-back"
          src="https://aaronthecarter.github.io/Aimer/Dear,%20you...%20.png"
          alt="Aimer back cover"
        >
      </div>

    </div>
  </div>
</main>

<script>
function openBook() {
  const newTab = window.open("about:blank", "_blank");

  if (!newTab) {
    alert("Please allow pop-ups to open the book.");
    return;
  }

  newTab.document.open();
  newTab.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>Thank you for visiting!</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <style>
        * { box-sizing: border-box; }
        html, body {
          margin: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #fff;
        }
        iframe {
          width: 100%;
          height: 100%;
          border: 0;
          display: block;
        }
      </style>
    </head>
    <body>
      <iframe
        src="https://aaronthecarter.github.io/Aimer/Aimer.pdf"
        title="Aimer"
      ></iframe>
    </body>
    </html>
  `);
  newTab.document.close();

  window.close();
}

document.getElementById("bookContainer")
  .addEventListener("click", openBook);
</script>

</body>
</html>
